<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Would You Rather</title>
  <meta name="description" content="A simple, thoughtful Would You Rather game." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <h1>Would You Rather</h1>
      <button id="shuffleBtn" class="ghost">Shuffle</button>
    </header>

    <main class="card" id="card">
      <div class="meta">
        <span id="counter">0/0</span>
        <button id="shareBtn" class="ghost">Share</button>
      </div>
      <p class="question" id="question">Loading…</p>
      <div class="options">
        <button id="optionA" class="option"></button>
        <button id="optionB" class="option"></button>
      </div>
      <div class="nav">
        <button id="prevBtn" class="ghost">Prev</button>
        <button id="nextBtn" class="primary">Next</button>
      </div>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> Would You Rather</span>
    </footer>
  </div>
  <script src="/app.js" type="module"></script>
</body>
</html>
